name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q "$GITHUB_WORKSPACE/godot-upload.zip" -d project
          ls -la project/godot-upload

      - name: Install SDK 34 components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ls $ANDROID_HOME/build-tools
          ls $ANDROID_HOME/platforms

      - name: Ensure export templates
        run: |
          if [ ! -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/tpz.tpz
            mkdir -p /root/.local/share/godot/export_templates
            cd /tmp && unzip -o -q tpz.tpz
            mv /tmp/templates /root/.local/share/godot/export_templates/4.3.stable
          fi
          ls /root/.local/share/godot/export_templates/4.3.stable | head -5

      - name: Write editor settings
        run: |
          mkdir -p /root/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = true' \
            > /root/.config/godot/editor_settings-4.3.tres

      - name: Write export presets
        run: |
          cd project/godot-upload
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="build.apk"' \
            '' \
            '[preset.0.options]' \
            'gradle_build/use_gradle_build=false' \
            'gradle_build/min_sdk="21"' \
            'gradle_build/target_sdk="34"' \
            'architectures/armeabi-v7a=true' \
            'architectures/arm64-v8a=true' \
            'version/code=1' \
            'version/name="1.0"' \
            'package/unique_name="com.gunstorm.game"' \
            'package/name="GunStorm3D"' \
            'package/signed=true' \
            'screen/immersive_mode=true' \
            'keystore/debug="/root/debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' \
            > export_presets.cfg

      - name: Export APK
        run: |
          cd project/godot-upload
          godot --headless --export-debug "Android" build.apk
          ls -la
          test -f build.apk && echo "APK_OK size: $(stat -c%s build.apk)" || (echo "APK_MISSING" && exit 1)

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm3D-APK
          path: project/godot-upload/build.apk

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PROJECT: /tmp/project/godot-upload
  GODOT: /tmp/godot/Godot_v4.3-stable_linux.x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir /tmp/project
          cd /tmp/project
          unzip -q "$GITHUB_WORKSPACE/godot-upload.zip"
          ls -la $PROJECT

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x $GODOT

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          cd /tmp
          unzip -q templates.tpz
          mv /tmp/templates ~/.local/share/godot/export_templates/4.3.stable
          ls ~/.local/share/godot/export_templates/4.3.stable | head -5

      - name: Install JDK and Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless adb
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" > /dev/null 2>&1
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Create debug keystore
        run: |
          cd $PROJECT
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Write export presets
        run: |
          cd $PROJECT
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'advanced_options=false' \
            'dedicated_server=false' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="build.apk"' \
            'script_export_mode=2' \
            '' \
            '[preset.0.options]' \
            'custom_template/debug=""' \
            'custom_template/release=""' \
            'gradle_build/use_gradle_build=false' \
            'gradle_build/gradle_build_directory=""' \
            'gradle_build/android_source_template=""' \
            'gradle_build/compress_native_libraries=false' \
            'gradle_build/export_format=0' \
            'gradle_build/min_sdk=""' \
            'gradle_build/target_sdk=""' \
            'architectures/armeabi-v7a=true' \
            'architectures/arm64-v8a=true' \
            'architectures/x86=false' \
            'architectures/x86_64=false' \
            'version/code=1' \
            'version/name="1.0"' \
            'package/unique_name="com.gunstorm.game"' \
            'package/name="GunStorm3D"' \
            'package/signed=true' \
            'package/app_category=2' \
            'screen/immersive_mode=true' \
            > export_presets.cfg
          cat export_presets.cfg

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            'export/android/android_sdk_path = "'"$HOME"'/android-sdk"' \
            'export/android/debug_keystore = "/tmp/project/godot-upload/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = true' \
            > ~/.config/godot/editor_settings-4.3.tres
          echo "---- editor settings file ----"
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: |
          cd $PROJECT
          $GODOT --headless --import .

      - name: Export APK
        run: |
          cd $PROJECT
          $GODOT --headless --verbose --export-debug "Android" build.apk 2>&1 | tee /tmp/export_log.txt
          ls -la $PROJECT
          test -f $PROJECT/build.apk && echo "APK_OK size: $(stat -c%s $PROJECT/build.apk)" || (echo "APK_MISSING" && exit 1)

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm3D-APK
          path: /tmp/project/godot-upload/build.apk

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: /tmp/export_log.txt

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PROJECT: /tmp/project/godot-upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir /tmp/project
          cd /tmp/project
          unzip -q "$GITHUB_WORKSPACE/godot-upload.zip"
          ls -la $PROJECT

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          cd /tmp
          unzip -q templates.tpz
          mv /tmp/templates ~/.local/share/godot/export_templates/4.3.stable
          ls ~/.local/share/godot/export_templates/4.3.stable | head -5

      - name: Create debug keystore
        run: |
          cd $PROJECT
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Write export presets
        run: |
          cd $PROJECT
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build.apk"

          [preset.0.options]
          gradle_build/use_gradle_build=false
          package/unique_name="com.gunstorm.game"
          package/name="GunStorm3D"
          version/code=1
          version/name="1.0"
          screen/immersive_mode=true
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="debug.keystore"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF
          cat export_presets.cfg

      - name: Import project
        run: |
          cd $PROJECT
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --import .

      - name: Export APK
        run: |
          cd $PROJECT
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Android" build.apk
          ls -la $PROJECT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm3D-APK
          path: /tmp/project/godot-upload/build.apk

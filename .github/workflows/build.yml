name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q "$GITHUB_WORKSPACE/godot-upload.zip" -d project
          ls -la project/godot-upload

      - name: Write export presets
        run: |
          cd project/godot-upload
          printf '%s\n' \
            '[preset.0]' \
            'name="Android"' \
            'platform="Android"' \
            'runnable=true' \
            'export_filter="all_resources"' \
            'include_filter=""' \
            'exclude_filter=""' \
            'export_path="build.apk"' \
            '' \
            '[preset.0.options]' \
            'gradle_build/use_gradle_build=false' \
            'architectures/armeabi-v7a=true' \
            'architectures/arm64-v8a=true' \
            'version/code=1' \
            'version/name="1.0"' \
            'package/unique_name="com.gunstorm.game"' \
            'package/name="GunStorm3D"' \
            'package/signed=true' \
            'screen/immersive_mode=true' \
            'keystore/debug="/root/android/debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' \
            > export_presets.cfg
          cat export_presets.cfg

      - name: Export APK
        run: |
          cd project/godot-upload
          godot --headless --export-debug "Android" build.apk
          ls -la
          test -f build.apk && echo "APK_OK size: $(stat -c%s build.apk)" || (echo "APK_MISSING" && exit 1)

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm3D-APK
          path: project/godot-upload/build.apk

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir /tmp/project
          cd /tmp/project
          unzip -q "$GITHUB_WORKSPACE/godot-upload.zip"
          ls -la

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          cd /tmp && unzip -q templates.tpz
          cp /tmp/templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          mv ~/.local/share/godot/export_templates/templates 2>/dev/null ~/.local/share/godot/export_templates/4.3.stable || true
          ls ~/.local/share/godot/export_templates/

      - name: Create export presets and keystore
        run: |
          mkdir -p /tmp/project
          cd /tmp/project
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter="godot-upload.zip"
          export_path="build.apk"

          [preset.0.options]
          gradle_build/use_gradle_build=false
          package/unique_name="com.gunstorm.game"
          package/name="GunStorm3D"
          version/code=1
          version/name="1.0"
          launcher_icons/main_192x192=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=true
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF
          echo "presets written"

      - name: Import project and export APK
        run: |
          cd /tmp/project
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --import . || true
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Android" build.apk || true
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GunStorm3D-APK
          path: /tmp/project/build.apk

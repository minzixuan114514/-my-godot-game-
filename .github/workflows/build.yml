name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          cd /home/runner/work/-my-godot-game-/-my-godot-game-
          mv godot-upload.zip /tmp/project.zip
          mkdir /tmp/project
          cd /tmp/project
          unzip -q /tmp/project.zip
          ls -la

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Export Android build (stage 1 - gradle project)
        run: |
          cd /tmp/project
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --import . 2>&1 || true
        continue-on-error: true

      - name: Done
        run: echo "stage complete"
